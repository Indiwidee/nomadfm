name: Release desktop apps

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to attach the release to (e.g. v0.2.0)'
        required: true
        default: 'v0.1.0'

permissions:
  contents: write

jobs:
  windows:
    name: Windows (msi + nsis)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - run: pnpm install --frozen-lockfile

      - name: Build desktop bundle
        run: pnpm --dir apps/mainapp tauri build

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: |
            apps/mainapp/src-tauri/target/release/bundle/msi/*.msi
            apps/mainapp/src-tauri/target/release/bundle/nsis/*.exe

  flatpak:
    name: Flatpak (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build frontend for desktop (relative asset paths)
        env:
          TAURI_ENV_PLATFORM: linux
        run: pnpm --dir apps/mainapp build

      - name: Remove node_modules before flatpak build
        run: rm -rf node_modules apps/*/node_modules

      - name: Install flatpak tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder

      - name: Add flathub remote
        run: flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo

      - name: Build flatpak
        run: flatpak-builder --user --install-deps-from=flathub --force-clean --default-branch="${{ inputs.tag || github.ref_name }}" --repo=flatpak-repo build apps/mainapp/flatpak/fm.nomad.app.yml

      - name: Bundle
        # flatpak-builder already exported the app to the repo (branch set
        # via --default-branch); build-bundle just wraps it into a file.
        run: flatpak build-bundle flatpak-repo "nomadfm-${{ inputs.tag || github.ref_name }}-x86_64.flatpak" fm.nomad.app "${{ inputs.tag || github.ref_name }}"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: nomadfm-${{ inputs.tag || github.ref_name }}-x86_64.flatpak
