name: Release desktop apps

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to attach the release to (e.g. v0.2.0)'
        required: true
        default: 'v0.1.0'

permissions:
  contents: write

jobs:
  windows:
    name: Windows (msi + nsis)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - run: pnpm install --frozen-lockfile

      - name: Build desktop bundle
        run: pnpm --dir apps/desktop tauri build

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: |
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe

  flatpak:
    name: Flatpak (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Install flatpak tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder

      - name: Add flathub remote
        run: flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo

      - name: Build flatpak
        # No frontend to build: the desktop app is a URL loader, cargo
        # compiles the shell and fetches deps inside the sandbox.
        run: flatpak-builder --user --install-deps-from=flathub --force-clean --default-branch="${{ inputs.tag || github.ref_name }}" --repo=flatpak-repo build apps/desktop/flatpak/fm.nomad.app.yml

      - name: Bundle
        # flatpak-builder already exported the app to the repo (branch set
        # via --default-branch); build-bundle just wraps it into a file.
        run: flatpak build-bundle flatpak-repo "nomadfm-${{ inputs.tag || github.ref_name }}-${{ matrix.arch }}.flatpak" fm.nomad.app "${{ inputs.tag || github.ref_name }}"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: nomadfm-${{ inputs.tag || github.ref_name }}-${{ matrix.arch }}.flatpak
