name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-build:
    name: Lint & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: |
          pnpm --dir apps/mainapp lint
          pnpm --dir apps/landing lint

      - name: Build app
        run: pnpm --dir apps/mainapp build

      - name: Build landing
        run: pnpm --dir apps/landing build
