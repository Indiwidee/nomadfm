id: fm.nomad.app
runtime: org.gnome.Platform
runtime-version: '48'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: mainapp

finish-args:
  - --share=network
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --socket=pulseaudio
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.kde.StatusNotifierWatcher
  - --talk-name=org.a11y.Bus

modules:
  - name: mainapp
    buildsystem: simple
    build-commands:
      - export PATH="/usr/lib/sdk/rust-stable/bin:$PATH"
      - cargo build --locked --release --manifest-path src-tauri/Cargo.toml
      - install -Dm755 src-tauri/target/release/mainapp /app/bin/mainapp
      - install -Dm644 src-tauri/icons/32x32.png /app/share/icons/hicolor/32x32/apps/fm.nomad.app.png
      - install -Dm644 src-tauri/icons/128x128.png /app/share/icons/hicolor/128x128/apps/fm.nomad.app.png
      - install -Dm644 src-tauri/icons/128x128@2x.png /app/share/icons/hicolor/256x256/apps/fm.nomad.app.png
      - install -Dm644 flatpak/fm.nomad.app.desktop /app/share/applications/fm.nomad.app.desktop
    sources:
      - type: dir
        path: ../..
